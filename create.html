<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickInvoice NG</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;padding:15px;max-width:600px;margin:auto;background:#f9f9f9}
input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #eee;padding:6px;text-align:left;background:#fff}
#invoicePreview{border:1px solid #000;padding:20px;margin-top:20px;background:#fff;min-height:400px}
.banner{background:#fef3c7;padding:10px;text-align:center;border-radius:8px;margin-bottom:10px}
.btn{padding:12px;border:none;border-radius:8px;color:#fff;cursor:pointer;width:100%;margin-top:8px;font-weight:bold}
.logo-preview{max-width:80px;max-height:80px;display:none;margin-bottom:10px}
</style>
</head>
<body>

<div id="freeBanner" class="banner">🆓 Free: <span id="countLeft">3</span>/3 left</div>

<h2>Create Invoice</h2>

<label><strong>Business Logo (optional)</strong></label>
<input type="file" id="logoUpload" accept="image/*">

<label><strong>Your Business Name</strong></label>
<input id="bizName" placeholder="e.g. Tunde Fashion Hub" oninput="updatePreview()">

<label><strong>Client Name</strong></label>
<input id="clientName" placeholder="Client Name" oninput="updatePreview()">

<label><strong>Client Email (for Paystack receipt)</strong></label>
<input id="clientEmail" placeholder="client@gmail.com">

<h3>Items</h3>
<div id="itemsContainer"></div>
<button onclick="addItem()" style="padding:8px 14px;margin-top:8px;background:#e5e7eb;border:none;border-radius:6px;cursor:pointer">+ Add Item</button>

<div style="text-align:right;margin-top:15px;font-weight:bold;font-size:18px">Total: ₦<span id="totalDisplay">0</span></div>

<h3 style="margin-top:20px">Signature</h3>
<label>Upload your signature image (from phone gallery)</label>
<input type="file" id="sigUpload" accept="image/*">
<p style="font-size:12px;color:gray">It will appear at bottom of invoice above "Seller Signature" line. If blank, leave space for hand sign after printing.</p>

<div id="invoicePreview">
<div style="display:flex;justify-content:space-between;align-items:start">
<div>
<img id="pLogo" class="logo-preview" style="display:none">
<h3 id="pBizName" style="margin:0">Business Name</h3>
</div>
<div style="text-align:right;font-size:12px">Date: <span id="pDate"></span></div>
</div>
<hr>
<p>Bill To: <strong><span id="pClient">-</span></strong></p>
<div id="pItems"></div>
<p style="text-align:right;margin-top:15px"><strong>Total: ₦<span id="pTotal">0</span></strong></p>

<div id="pSigArea" style="margin-top:50px;display:flex;flex-direction:column;align-items:flex-start">
<img id="pSigImg" style="max-width:130px;max-height:60px;display:none;margin-bottom:5px">
<div>__________________</div>
<div style="font-size:12px">Seller Signature</div>
</div>
</div>

<button class="btn" style="background:#16a34a" onclick="handleGenerate()">Generate & Save Invoice</button>
<button class="btn" style="background:#2563eb" onclick="downloadPDF()">Download PDF (to Files)</button>
<button class="btn" style="background:#7c3aed" onclick="downloadJPG()">Download JPG (to Gallery)</button>
<script>
const SUPA_URL = "https://owsismprvbndwlaktohz.supabase.co";
const SUPA_KEY = "sb_publishable_8auPuaDH5Iq65d_6LwPEKQ_yilaScba"; 
const supabaseClient = window.supabase.createClient(SUPA_URL, SUPA_KEY);

let items = [{name:"",desc:"",qty:1,price:0}];
let signatureDataUrl = "";
let logoDataUrl = "";

function getUserId(){ let id=localStorage.getItem("qi_uid"); if(!id){ id="user_"+Math.random().toString(36).substring(2,9); localStorage.setItem("qi_uid",id);} return id; }
const userId = getUserId(); // <-- FIX 1: DEFINE THIS

async function checkProStatus(){
  try{
    const { data: sub } = await supabaseClient
      .from("subscriptions")
      .select("*")
      .eq("user_id", userId) // now works
      .maybeSingle();

    if (sub?.is_pro && new Date(sub.expiry) > new Date()) {
        localStorage.setItem("qi_pro","yes");
        localStorage.setItem("qi_pro_expiry", sub.expiry);
        document.getElementById("freeBanner").innerHTML = "✅ Pro Active - Unlimited";
        return true;
    }
  }catch(e){ console.log(e) }
  
  let count=parseInt(localStorage.getItem("qi_count")||"0");
  const left = Math.max(0,3-count);
  document.getElementById("freeBanner").innerHTML = `🆓 Free: <span id="countLeft">${left}</span>/3 left`;
  return left > 0;
}

async function handleGenerate(){
  let count=parseInt(localStorage.getItem("qi_count")||"0");
  let hasLeft = await checkProStatus();
  let isProLocal = localStorage.getItem("qi_pro")==="yes";

  if(!isProLocal && count>=3){ 
    payWithPaystack(); 
    return; 
  }

  try{ 
    await supabaseClient.from("invoices").insert([{user_id:userId, business_name:document.getElementById("bizName").value, client_name:document.getElementById("clientName").value, total:getTotal(), items:items}]); 
  }catch(e){ console.log("invoice save error", e) }

  localStorage.setItem("qi_count", String(count+1));
  await checkProStatus();
  alert(`Invoice saved! ${2-count} free left`);
}

function payWithPaystack(){
  let email=document.getElementById("clientEmail").value||"customer@quickinvoice.ng";
  let handler=PaystackPop.setup({
    key:'pk_test_60231c395a4e19b0be16d06b4b9417c09c2debde',
    email:email,
    amount:3000 * 100,
    currency:'NGN',
    ref:'QI_'+Math.floor(Math.random()*1000000000+1),
    onClose:()=>alert('Payment closed'),
    callback: async function(response){
      const expiry = new Date(Date.now()+30*24*60*60*1000).toISOString();
      const { error } = await supabaseClient.from("subscriptions").upsert({ 
        user_id: userId, // <-- FIX 2: now defined
        is_pro: true, 
        expiry: expiry 
      }, { onConflict: 'user_id' });
      
      if(error){ alert("Supabase error: "+error.message); return; }

      localStorage.setItem("qi_pro","yes");
      localStorage.setItem("qi_pro_expiry", expiry);
      localStorage.setItem("qi_count","0");
      alert('Payment success! Pro activated for 30 days - ₦3000');
      location.reload();
    }
  });
  handler.openIframe();
}
</script>
</body>
</html>

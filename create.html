<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QuickInvoice NG</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:system-ui;padding:15px;max-width:600px;margin:auto}
input,textarea{width:100%;padding:10px;margin:6px 0;border:1px solid #ddd;border-radius:8px}
table{width:100%;border-collapse:collapse;margin-top:10px}
th,td{border:1px solid #eee;padding:8px;text-align:left}
#invoicePreview{border:1px solid #000;padding:20px;margin-top:20px;background:#fff}
.banner{background:#fef3c7;padding:10px;text-align:center;border-radius:8px;margin-bottom:10px}
.btn{padding:12px;border:none;border-radius:8px;color:#fff;cursor:pointer;width:100%;margin-top:8px}
</style>
</head>
<body>

<div id="freeBanner" class="banner">🆓 Free: <span id="countLeft">3</span>/3 left</div>

<h2>Create Invoice</h2>

<input id="bizName" placeholder="Your Business Name">
<input id="clientName" placeholder="Client Name">
<input id="clientEmail" placeholder="Client Email (for payment)">

<h3>Items</h3>
<table id="itemsTable">
<thead><tr><th>Item</th><th>Desc</th><th>Qty</th><th>Price</th><th></th></tr></thead>
<tbody id="itemsBody"></tbody>
</table>
<button onclick="addItem()" style="margin-top:8px">+ Add Item</button>

<div style="text-align:right;margin-top:10px;font-weight:bold">Total: ₦<span id="totalDisplay">0</span></div>

<h3>Signature</h3>
<input type="file" id="sigUpload" accept="image/*">
<div style="font-size:12px;color:gray">Leave blank if you want to sign by hand after printing</div>

<div id="invoicePreview">
<h3 id="pBizName">Business Name</h3>
<p>Client: <span id="pClient"></span></p>
<div id="pItems"></div>
<p><strong>Total: ₦<span id="pTotal">0</span></strong></p>
<div id="pSigArea" style="margin-top:30px">
<div>__________________</div>
<div style="font-size:12px">Seller Signature</div>
<img id="pSigImg" style="max-width:120px;display:none;margin-top:5px">
</div>
</div>

<button class="btn" style="background:#16a34a" onclick="handleGenerate()">Generate Invoice</button>
<button class="btn" style="background:#2563eb" onclick="downloadPDF()">Download PDF (Files)</button>
<button class="btn" style="background:#7c3aed" onclick="downloadJPG()">Download JPG (Gallery)</button>

<script>
const SUPA_URL = "owsismprvbndwlaktohz.superbase.co";
const SUPA_KEY = "sb_publishable_8auPuaDH5Iq65d_6LwPEKQ_yilaScba";
const supabaseClient = supabase.createClient(SUPA_URL, SUPA_KEY);

let items = [{name:"",desc:"",qty:1,price:0}];
let signatureDataUrl = "";

function addItem(){ items.push({name:"",desc:"",qty:1,price:0}); renderItems(); }
function renderItems(){
  const body = document.getElementById("itemsBody");
  body.innerHTML="";
  items.forEach((it,i)=>{
    body.innerHTML+=`<tr>
    <td><input value="${it.name}" oninput="items[${i}].name=this.value; updatePreview()"></td>
    <td><input value="${it.desc}" placeholder="small desc" oninput="items[${i}].desc=this.value; updatePreview()"></td>
    <td><input type="number" value="${it.qty}" style="width:60px" oninput="items[${i}].qty=parseInt(this.value)||0; updatePreview()"></td>
    <td><input type="number" value="${it.price}" style="width:80px" oninput="items[${i}].price=parseFloat(this.value)||0; updatePreview()"></td>
    <td><button onclick="items.splice(${i},1);renderItems();updatePreview()">x</button></td>
    </tr>`;
  });
  updatePreview();
}
function getTotal(){ return items.reduce((s,it)=>s+(it.qty*it.price),0); }
function updatePreview(){
  document.getElementById("pBizName").innerText = document.getElementById("bizName").value || "Business Name";
  document.getElementById("pClient").innerText = document.getElementById("clientName").value || "-";
  let html="<table style='width:100%'><tr><th>Item</th><th>Qty</th><th>Price</th></tr>";
  items.forEach(it=>{
    html+=`<tr><td>${it.name}<br><small style='color:gray'>${it.desc}</small></td><td>${it.qty}</td><td>₦${it.qty*it.price}</td></tr>`;
  });
  html+="</table>";
  document.getElementById("pItems").innerHTML=html;
  document.getElementById("totalDisplay").innerText=getTotal().toLocaleString();
  document.getElementById("pTotal").innerText=getTotal().toLocaleString();
}

document.getElementById("sigUpload").addEventListener("change",function(e){
  const file=e.target.files[0];
  if(!file) return;
  const reader=new FileReader();
  reader.onload=function(ev){
    signatureDataUrl=ev.target.result;
    document.getElementById("pSigImg").src=signatureDataUrl;
    document.getElementById("pSigImg").style.display="block";
  };
  reader.readAsDataURL(file);
});

function getUserId(){ let id=localStorage.getItem("qi_uid"); if(!id){ id="user_"+Math.random().toString(36).substring(2,9); localStorage.setItem("qi_uid",id);} return id; }

async function handleGenerate(){
  let count=parseInt(localStorage.getItem("qi_count")||"0");
  let isPro=localStorage.getItem("qi_pro")==="yes";
  if(!isPro && count>=3){ payWithPaystack(); return; }
  // save to supabase
  try{
    await supabaseClient.from("invoices").insert([{user_id:getUserId(), business_name:document.getElementById("bizName").value, client_name:document.getElementById("clientName").value, total:getTotal(), items:items}]);
  }catch(e){ console.log(e); }
  localStorage.setItem("qi_count",count+1);
  updateFreeBanner();
  alert("Invoice generated! Now download PDF or JPG.");
}

function updateFreeBanner(){
  let count=parseInt(localStorage.getItem("qi_count")||"0");
  let isPro=localStorage.getItem("qi_pro")==="yes";
  if(isPro){ document.getElementById("freeBanner").innerHTML="✅ Pro Active"; return; }
  document.getElementById("countLeft").innerText=Math.max(0,3-count);
}

function payWithPaystack(){
  let email=document.getElementById("clientEmail").value||"customer@quickinvoice.ng";
  let handler=PaystackPop.setup({
    key:'pk_live_f5336ea9deef3d7c492b102600f02716f38adaed',
    email:email,
    amount:300000,
    currency:'NGN',
    ref:'QI_'+Math.floor(Math.random()*1000000000+1),
    onClose:function(){ alert('Payment closed'); },
    callback:function(response){
      alert('Payment success: '+response.reference);
      localStorage.setItem("qi_pro","yes");
      localStorage.setItem("qi_pro_expiry", new Date(Date.now()+30*24*60*60*1000).toISOString());
      localStorage.setItem("qi_count","0");
      location.reload();
    }
  });
  handler.openIframe();
}

function downloadPDF(){
  const {jsPDF}=window.jspdf;
  html2canvas(document.getElementById("invoicePreview")).then(canvas=>{
    const imgData=canvas.toDataURL('image/png');
    const pdf=new jsPDF();
    pdf.addImage(imgData,'PNG',10,10,190,0);
    pdf.save('invoice_'+Date.now()+'.pdf');
  });
}
function downloadJPG(){
  html2canvas(document.getElementById("invoicePreview")).then(canvas=>{
    let link=document.createElement('a');
    link.download='invoice_'+Date.now()+'.jpg';
    link.href=canvas.toDataURL('image/jpeg',0.95);
    link.click();
  });
}

renderItems();
updateFreeBanner();
document.getElementById("bizName").addEventListener("input",updatePreview);
document.getElementById("clientName").addEventListener("input",updatePreview);
</script>
</body>
</html>
